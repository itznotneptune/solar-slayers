plugins {
	// 26.x is unobfuscated: plain Loom, no mappings and no remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Jar name carries the Minecraft version, e.g. solarslayers-0.1.0+26.3.jar
version = "${mod_version}+${minecraft_version}"
base.archivesName = 'solarslayers'

loom {
	splitEnvironmentSourceSets()
	mods {
		"solarslayers" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_dependency: project.minecraft_dependency]
	inputs.properties props
	filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
